<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120d22">
<title>⚗️ 연금술 디펜스</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
    background:#08060f;color:#f3ecff;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
  body{display:flex;justify-content:center}
  #app{position:relative;display:flex;flex-direction:column;width:100%;max-width:430px;
    height:100vh;height:100dvh;overflow:hidden;
    background:radial-gradient(120% 72% at 50% 0%,#2a1d4e 0%,#150f29 52%,#0a0716 100%)}

  /* ── HUD ── */
  #hud{position:relative;z-index:6;display:flex;align-items:center;gap:7px;padding:calc(6px + env(safe-area-inset-top)) 11px 5px}
  .waveTag{font-size:12px;font-weight:900;letter-spacing:.3px;padding:5px 10px;border-radius:999px;
    background:linear-gradient(180deg,#493476,#2a1f4d);border:1px solid #6a51a8;color:#ffdc94;white-space:nowrap;
    box-shadow:0 2px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
  .wall{flex:1;display:flex;align-items:center;gap:6px;background:rgba(28,20,50,.9);border:1px solid #3f3168;
    border-radius:999px;padding:4px 8px 4px 6px;min-width:0}
  .wall .heartsvg{width:14px;height:14px;flex:0 0 14px}
  .wall .bar{flex:1;height:9px;background:#150f28;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px #000}
  .wall .bar i{display:block;height:100%;width:100%;border-radius:99px;
    background:linear-gradient(90deg,#2fd07c,#9cf25e);transition:width .25s ease,background .3s}
  .wall.low .bar i{background:linear-gradient(90deg,#ff4d4d,#ff9a3c)}
  .wall .num{font-size:10.5px;font-weight:800;color:#d9ffe9;min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
  .killTag{font-size:10.5px;font-weight:800;color:#c7b6f0;white-space:nowrap;padding-left:2px}
  #soundBtn,#resetBtn{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:1px solid #3f3168;background:rgba(28,20,50,.9);
    color:#c7b6f0;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
  #soundBtn.off{color:#6b5f8f}

  /* ── 전장 ── */
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;text-align:center;font-size:11.5px;font-weight:700;
    color:#e2d7ff;white-space:nowrap;padding:5px 12px;border-radius:99px;background:rgba(20,13,38,.72);
    border:1px solid rgba(140,110,215,.35);text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity .5s;z-index:3}
  #hint b{color:#ffd34d}
  #hint.gone{opacity:0}
  #banner{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;z-index:4}
  #banner.show{opacity:1}
  #banner b{display:block;font-size:23px;font-weight:900;letter-spacing:.5px;
    background:linear-gradient(#fff3cf,#ffc247);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 10px rgba(255,170,40,.55))}
  #banner span{display:block;margin-top:2px;font-size:12px;font-weight:700;color:#d9c9ff;text-shadow:0 2px 8px #000}

  /* ── 연금술 애니메이션 ── */
  #brew{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  .orb{position:absolute;width:46px;height:46px;margin:0;opacity:.95;
    transition:transform .5s cubic-bezier(.45,-.25,.3,1.3),opacity .5s;
    filter:drop-shadow(0 0 12px rgba(255,205,120,.75))}
  .orb svg{width:100%;height:100%;display:block}
  .burst{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle,#fff 0%,#ffe6a8 35%,rgba(255,170,60,.55) 60%,rgba(255,120,40,0) 72%);
    animation:burstGo .55s ease-out forwards}
  @keyframes burstGo{0%{width:8px;height:8px;opacity:1}70%{opacity:.9}100%{width:260px;height:260px;opacity:0}}
  .bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,220,150,.65));
    transform:translate(-50%,-50%);animation:bubGo .8s ease-out forwards}
  @keyframes bubGo{0%{opacity:.95;transform:translate(-50%,-50%) scale(.4)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.25)}}
  .born{position:absolute;transform:translate(-50%,-50%) scale(.4);opacity:0;text-align:center;
    animation:bornGo 1.05s ease-out forwards;z-index:2}
  .born .bc{width:64px;height:64px;margin:0 Auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%,rgba(255,240,200,.95),rgba(255,170,60,.35) 58%,rgba(255,120,40,0) 72%);
    filter:drop-shadow(0 0 16px rgba(255,190,90,.9))}
  .born .bc svg{width:44px;height:44px}
  .born .bn{margin-top:2px;font-size:12.5px;font-weight:900;color:#fff6dd;white-space:nowrap;
    text-shadow:0 2px 10px #000,0 0 18px rgba(255,180,60,.9)}
  @keyframes bornGo{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
    22%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
    38%{transform:translate(-50%,-50%) scale(1)}
    78%{opacity:1;transform:translate(-50%,-52%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-78%) scale(.9)}}

  /* ── 하단 연금술 랩 ── */
  #lab{position:relative;z-index:6;flex:0 0 auto;padding:7px 11px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(38,27,68,.15) 0%,rgba(24,17,44,.97) 26%);
    border-top:1px solid rgba(126,100,200,.28);box-shadow:0 -8px 26px rgba(0,0,0,.5)}
  .labHead{display:flex;align-items:baseline;justify-content:space-between;margin:0 3px 6px}
  .labHead b{font-size:12.5px;font-weight:900;letter-spacing:.2px;
    background:linear-gradient(#ffe9b0,#ffb43c);-webkit-background-clip:text;background-clip:text;color:transparent}
  .labHead span{font-size:10px;color:#a293c9;font-weight:700}
  #reels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .reel{position:relative;height:88px;border-radius:15px;border:1.5px solid #4a3a78;
    background:linear-gradient(180deg,#2c2153,#1a1334);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1px;padding:5px 3px;font-family:inherit;color:#ece4ff;cursor:pointer;
    transition:transform .1s,border-color .2s,box-shadow .2s,background .2s}
  .reel:active{transform:scale(.96)}
  .reel .ico{width:40px;height:40px;display:block;transition:filter .15s}
  .reel .nm{font-size:10.5px;font-weight:800;letter-spacing:.2px}
  .reel .role{font-size:8px;font-weight:700;color:#8d80b5;letter-spacing:.6px}
  .reel.locked{border-color:#ffd34d;background:linear-gradient(180deg,#43306e,#2b2050);
    box-shadow:0 0 0 2px rgba(255,211,77,.22),0 0 18px rgba(255,190,60,.4)}
  .reel.locked .lock{opacity:1;transform:translateY(0)}
  .reel .lock{position:absolute;top:-7px;right:-3px;font-size:8.5px;font-weight:900;color:#3a2600;
    background:linear-gradient(#ffe589,#ffb300);padding:2px 6px;border-radius:99px;letter-spacing:.5px;
    opacity:0;transform:translateY(3px);transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .reel.spinning .ico{animation:spinBlur .16s linear infinite}
  .reel.spinning{box-shadow:inset 0 0 22px rgba(120,90,220,.6)}
  @keyframes spinBlur{0%{opacity:.3;transform:translateY(-5px) scale(.92)}
    50%{opacity:1;transform:translateY(0) scale(1.04)}100%{opacity:.3;transform:translateY(5px) scale(.92)}}
  .reel.pop{animation:reelPop .22s ease-out}
  @keyframes reelPop{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
  #btns{display:flex;gap:7px;margin-top:8px}
  .btn{border:0;border-radius:15px;font-family:inherit;font-weight:900;cursor:pointer;
    transition:transform .08s,filter .2s;display:flex;align-items:center;justify-content:center;gap:5px}
  .btn:active{transform:scale(.975)}
  #rerollBtn{flex:0 0 39%;height:54px;font-size:12px;background:linear-gradient(180deg,#3d2f6a,#281e49);
    border:1.5px solid #5b479a;color:#ded4ff;line-height:1.15}
  #rerollBtn b{color:#ffd34d;font-size:12.5px}
  #rerollBtn:disabled{opacity:.42;filter:grayscale(.5)}
  #combineBtn{position:relative;flex:1;height:54px;font-size:17px;overflow:hidden;
    background:linear-gradient(180deg,#ffd75e,#ff9a2e 55%,#f4650d);color:#4a1d00;
    box-shadow:0 5px 0 #8a3b06,0 9px 20px rgba(255,140,40,.32),inset 0 1px 0 rgba(255,255,255,.55);
    text-shadow:0 1px 0 rgba(255,255,255,.4);letter-spacing:.3px}
  #combineBtn:disabled{filter:grayscale(.5) brightness(.82);box-shadow:0 5px 0 #4a3a2a;cursor:default}
  #combineBtn .cd{position:absolute;left:0;bottom:0;height:3px;width:100%;background:rgba(96,42,0,.55);
    transform-origin:left center;transform:scaleX(0);pointer-events:none}
  .bico{width:21px;height:21px;flex:0 0 21px;display:flex}
  .bico svg{width:100%;height:100%;display:block}
  .labFlask{display:inline-flex;width:15px;height:15px;vertical-align:-3px;margin-right:4px}
  .labFlask svg{width:100%;height:100%;display:block}
  #combineBtn.pulse{animation:btnPulse 1.15s ease-in-out infinite}
  @keyframes btnPulse{0%,100%{box-shadow:0 5px 0 #8a3b06,0 9px 20px rgba(255,140,40,.32),inset 0 1px 0 rgba(255,255,255,.55)}
    50%{box-shadow:0 5px 0 #8a3b06,0 0 26px rgba(255,190,70,.85),inset 0 1px 0 rgba(255,255,255,.7)}}

  /* ── 레이어 ── */
  .layer{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:9px;padding:22px 16px calc(22px + env(safe-area-inset-bottom));background:rgba(9,6,20,.86);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);animation:fadeIn .22s ease-out}
  .layer.hidden{display:none}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .overIcon{width:64px;height:64px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;background:radial-gradient(circle at 50% 35%,rgba(255,120,90,.28),rgba(255,90,60,.05) 70%);
    border:1px solid rgba(255,140,110,.35);margin-bottom:2px}
  .overIcon svg{width:38px;height:38px}
  .overIcon.win{background:radial-gradient(circle at 50% 35%,rgba(255,215,90,.35),rgba(255,180,40,.05) 70%);
    border-color:rgba(255,215,90,.45);box-shadow:0 0 30px rgba(255,200,60,.35)}
  .upTitle.win{filter:drop-shadow(0 3px 14px rgba(120,255,190,.55))}
  .upTitle{font-size:20px;font-weight:900;letter-spacing:.3px;
    background:linear-gradient(#fff6d8,#ffc247);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 12px rgba(255,180,50,.5))}
  .upSub{font-size:12px;font-weight:700;color:#b6a7dd;margin:-4px 0 8px}
  .card{display:flex;align-items:center;gap:12px;width:100%;max-width:352px;padding:11px 13px;border-radius:17px;
    background:linear-gradient(180deg,#302458,#1d1538);border:1.5px solid #57448f;text-align:left;color:#fff;
    font-family:inherit;cursor:pointer;transition:transform .1s,border-color .2s,box-shadow .2s;
    animation:cardIn .3s backwards}
  .card:nth-child(3){animation-delay:.04s}.card:nth-child(4){animation-delay:.08s}.card:nth-child(5){animation-delay:.12s}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card:active{transform:scale(.985);border-color:#ffd34d}
  .card .ci{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,#4b3a7e,#2a2050);border:1px solid #5f4c9c}
  .card .ci svg{width:24px;height:24px}
  .card b{display:block;font-size:14px;font-weight:900;letter-spacing:.2px}
  .card small{display:block;margin-top:2px;font-size:10.5px;color:#a99fc7;line-height:1.35}
  .bigBtn{margin-top:6px;padding:14px 30px;border:0;border-radius:16px;font-family:inherit;font-size:16px;font-weight:900;
    color:#4a1d00;background:linear-gradient(180deg,#ffd75e,#ff9a2e);box-shadow:0 5px 0 #8a3b06;cursor:pointer}
  .bigBtn:active{transform:translateY(2px);box-shadow:0 3px 0 #8a3b06}
  .overStat{font-size:13px;font-weight:700;color:#d8caf5;text-align:center;line-height:1.6}
  .overStat b{color:#ffd34d;font-size:16px}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="waveTag" id="waveTag">웨이브 1</div>
    <div class="wall" id="wallBox">
      <svg class="heartsvg" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11A5 5 0 0 1 12 6a5 5 0 0 1 8 4c0 5.8-8 11-8 11z" fill="#63e89a"/></svg>
      <div class="bar"><i id="wallFill"></i></div>
      <div class="num" id="wallNum">100</div>
    </div>
    <div class="killTag" id="killTag">처치 0</div>
    <button id="soundBtn" title="소리">🔊</button>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="brew"></div>
    <div id="banner"><b></b><span></span></div>
    <div id="hint">아래 <b>조합하기!</b> 를 눌러 영웅을 소환하세요</div>
  </div>

  <section id="lab">
    <div class="labHead">
      <b><span class="labFlask" id="labFlask"></span>연금술 룰렛</b>
      <span>칸을 눌러 잠그고 → 다시 뽑기</span>
    </div>
    <div id="reels">
      <button class="reel" data-col="0"><span class="lock">LOCK</span><span class="ico"></span><span class="nm"></span><span class="role">원소</span></button>
      <button class="reel" data-col="1"><span class="lock">LOCK</span><span class="ico"></span><span class="nm"></span><span class="role">무기</span></button>
      <button class="reel" data-col="2"><span class="lock">LOCK</span><span class="ico"></span><span class="nm"></span><span class="role">등급</span></button>
    </div>
    <div id="btns">
      <button class="btn" id="rerollBtn"><span class="bico" id="rerollIco"></span>다시 뽑기 <b id="rrNum">1</b></button>
      <button class="btn" id="combineBtn"><span class="bico" id="combineIco"></span>조합하기!<span class="cd"></span></button>
    </div>
  </section>

  <div class="layer hidden" id="upLayer">
    <div class="upTitle">웨이브 클리어!</div>
    <div class="upSub">강화 하나를 골라 주세요</div>
    <div id="cards" style="display:flex;flex-direction:column;gap:8px;width:100%;align-items:center"></div>
  </div>

  <div class="layer hidden" id="overLayer">
    <div class="overIcon" id="overIcon"></div>
    <div class="upTitle" id="overTitle">성벽이 무너졌어요!</div>
    <div class="overStat" id="overStat"></div>
    <button class="bigBtn" id="retryBtn">다시 도전</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ═══════════ 유틸 ═══════════ */
const $ = s => document.querySelector(s);
const rnd = (a,b)=>a+Math.random()*(b-a);
const rndi = n => Math.floor(Math.random()*n);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rndi(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ═══════════ 사운드 (Web Audio API) ═══════════ */
const AU = {ctx:null, muted:false};
function actx(){
  if(!AU.ctx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{ AU.ctx = new AC(); }catch(e){ return null; }
  }
  if(AU.ctx.state === 'suspended') AU.ctx.resume().catch(()=>{});
  return AU.ctx;
}
function tone(freq, dur, type, vol, slideTo, delay){
  if(AU.muted) return;
  const c = actx(); if(!c) return;
  const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol==null?0.12:vol, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.04);
}
function noiseBurst(dur, f1, f2, vol, delay){
  if(AU.muted) return;
  const c = actx(); if(!c) return;
  const t0 = c.currentTime + (delay||0);
  const len = Math.max(1, Math.ceil(c.sampleRate*dur));
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 1.6);
  const src = c.createBufferSource(); src.buffer = buf;
  const bp = c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=5.5;
  bp.frequency.setValueAtTime(f1, t0);
  bp.frequency.exponentialRampToValueAtTime(f2, t0+dur);
  const g = c.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
  src.connect(bp); bp.connect(g); g.connect(c.destination);
  src.start(t0);
}
const SFX = {
  tick(){ tone(1100, .025, 'square', .022); },
  stop(){ tone(430, .09, 'triangle', .085, 250); },
  bubble(){ noiseBurst(.36, 280, 1500, .085); for(let i=0;i<5;i++) tone(rnd(260,720), .07, 'sine', .045, null, i*.055); },
  born(){ [523,659,784,1047].forEach((f,i)=>tone(f,.19,'triangle',.10,null,i*.075)); tone(261,.4,'sine',.05,null,.02); },
  merge(){ tone(280,.32,'sine',.13,1500); [784,988,1319].forEach((f,i)=>tone(f,.26,'triangle',.06,null,i*.05)); },
  hit(){ noiseBurst(.05,1200,400,.045); },
  pop(){ tone(520,.06,'square',.04,880); },
  wallHit(){ tone(120,.16,'sawtooth',.10,52); noiseBurst(.08,300,120,.05); },
  upgrade(){ [784,988,1319].forEach((f,i)=>tone(f,.22,'sine',.085,null,i*.06)); },
  over(){ [440,349,262].forEach((f,i)=>tone(f,.42,'triangle',.10,null,i*.15)); },
  pick(){ tone(660,.09,'triangle',.08,990); }
};

/* ═══════════ 데이터 ═══════════ */
const ELEM = {
  fire:{name:'화염', a:'#ffd28a', b:'#ff6a1f', glow:'rgba(255,120,40,.85)', ring:'#ff9b4a'},
  ice :{name:'빙결', a:'#d6f6ff', b:'#2aa8ec', glow:'rgba(80,190,255,.8)',  ring:'#6fd4ff'},
  bolt:{name:'번개', a:'#f0d8ff', b:'#8c4bff', glow:'rgba(170,110,255,.85)',ring:'#b98cff'}
};
const WEAP = {
  sword:{name:'기사', role:'근접', hp:150, atk:13, cd:.85, range:34,  splash:0},
  bow  :{name:'궁수', role:'원거리', hp:82,  atk:15, cd:.72, range:112, splash:0},
  staff:{name:'마법사', role:'광역', hp:66,  atk:26, cd:1.5, range:100, splash:36}
};
const TRAIT = {
  guard :{name:'수호', hp:1.75, atk:.85, dr:.32, splash:0},
  blast :{name:'폭발', hp:.9,  atk:1.45, dr:0,   splash:30},
  legend:{name:'전설', hp:1.25, atk:1.32, dr:.1, splash:16, spd:1.12}
};
const COLS = [['fire','ice','bolt'], ['sword','bow','staff'], ['guard','blast','legend']];
const COLNAME0 = {fire:'불', ice:'얼음', bolt:'번개'};
const STAR_MUL = [0, 1, 2.4, 5.0, 9.0, 15.0, 24.0];
const TUNE = { hpBase:26, hpGrow:1.43, countBase:4, countGrow:1.85,
               atkBase:8, atkGrow:1.33, wallBase:3.0, wallGrow:0.55, spdGrow:0.012, heroHp:0.5 };
const MAX_STAR = 6;
const WAVES_TOTAL = 12;

const cv = $('#cv'), ctx = cv.getContext('2d');
const stage = $('#stage'), brewEl = $('#brew'), hintEl = $('#hint');
const reelEls = Array.from(document.querySelectorAll('.reel'));
const combineBtn = $('#combineBtn'), rerollBtn = $('#rerollBtn'), rrNum = $('#rrNum');
const cdEl = combineBtn.querySelector('.cd');

/* ═══════════ 상태 ═══════════ */
const G = {
  phase:'play', t:0, wave:1, wall:100, wallMax:100, kills:0,
  heroes:[], enemies:[], shots:[], wallShots:[], parts:[], texts:[], rings:[],
  queue:[], spawnT:0, waveOn:false, waveClearT:-1,
  reels:[0,0,0], locked:-1, rerolls:1, rerollMax:1,
  cool:0, coolMax:1.5, spinning:0,
  mods:{atk:1, hp:1, elem:1, cool:1, legend:0},
  shake:0, flash:0, bannerT:0, firstCombine:false,
  heroSeq:0, seed:Math.random()*99
};

/* ═══════════ 캔버스 크기 ═══════════ */
let DPR = 1, GEO = {w:390, h:500, y:320};
function resize(){
  const r = stage.getBoundingClientRect();
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width*DPR);
  cv.height = Math.round(r.height*DPR);
  GEO = {w:r.width, h:r.height, y: r.height*0.55, horizon: r.height*0.40};
}
window.addEventListener('resize', ()=>{ resize(); });
window.addEventListener('orientationchange', ()=>setTimeout(resize,120));

/* ═══════════ 룰렛 UI ═══════════ */
function rollIndex(col){
  if(col === 2){
    const w = [38, 38, 24 + G.mods.legend*100];
    let r = Math.random()*w.reduce((a,b)=>a+b,0);
    for(let i=0;i<3;i++){ if(r < w[i]) return i; r -= w[i]; }
    return 2;
  }
  return rndi(3);
}
function drawReel(col){
  const key = COLS[col][G.reels[col]];
  const el = reelEls[col];
  el.querySelector('.ico').innerHTML = ICON[key];
  el.querySelector('.nm').textContent = col===0 ? COLNAME0[key] : (col===1 ? {sword:'검',bow:'활',staff:'지팡이'}[key] : TRAIT[key].name);
}
function renderReels(){ [0,1,2].forEach(drawReel); }
function syncLock(){
  reelEls.forEach((el,i)=>el.classList.toggle('locked', G.locked === i));
}
function syncButtons(){
  const busy = G.spinning > 0;
  combineBtn.disabled = busy || G.cool > 0 || G.phase !== 'play';
  rerollBtn.disabled = busy || G.rerolls <= 0 || G.phase !== 'play';
  rrNum.textContent = G.rerolls;
  combineBtn.classList.toggle('pulse', !G.firstCombine && G.phase === 'play' && !busy && G.cool <= 0);
}

function spinCols(cols, done){
  G.spinning++;
  syncButtons();
  let left = cols.length;
  cols.forEach((col, k)=>{
    const el = reelEls[col];
    el.classList.add('spinning');
    const iv = setInterval(()=>{
      G.reels[col] = rndi(3); drawReel(col); SFX.tick();
    }, 58);
    setTimeout(()=>{
      clearInterval(iv);
      G.reels[col] = rollIndex(col);
      drawReel(col);
      el.classList.remove('spinning');
      el.classList.add('pop');
      setTimeout(()=>el.classList.remove('pop'), 230);
      SFX.stop();
      left--;
      if(left === 0){
        G.spinning = Math.max(0, G.spinning-1);
        syncButtons(); syncLock();
        if(done) done();
      }
    }, 430 + k*150);
  });
}

/* ═══════════ 영웅 ═══════════ */
function heroStats(elem, weap, trait, star){
  const b = WEAP[weap], tm = TRAIT[trait];
  const sm = STAR_MUL[star] || 1;
  const hp = b.hp * tm.hp * sm * G.mods.hp * TUNE.heroHp;
  const atk = b.atk * tm.atk * sm * G.mods.atk;
  return {
    hp, atk,
    cd: b.cd / (tm.spd || 1),
    range: b.range + (weap==='bow' ? (star-1)*10 : 0),
    splash: (b.splash||0) + (tm.splash||0),
    dr: tm.dr || 0
  };
}
function heroName(elem, weap, trait){
  return ELEM[elem].name + ' ' + TRAIT[trait].name + ' ' + WEAP[weap].name;
}
function makeHero(elem, weap, trait, star){
  const s = heroStats(elem, weap, trait, star);
  return {
    id: ++G.heroSeq, elem, weap, trait, star,
    x:0, y:GEO.y, hp:s.hp, hpMax:s.hp, atk:s.atk, cd:s.cd, cdT: rnd(0,.4),
    range:s.range, splash:s.splash, dr:s.dr,
    hitT:0, born:0, seed: rnd(0,6.28), flash:0
  };
}
function layoutHeroes(){
  const n = G.heroes.length;
  if(!n) return;
  const front = Math.min(192, GEO.w*0.49);
  for(let i=0;i<n;i++){
    const col = i % 6, row = (i/6)|0;
    h_place(G.heroes[i], front - col*29, GEO.y + (row - 1)*26);
  }
}
function h_place(h,x,y){ h.x = x; h.y = y; }
function spawnHero(elem, weap, trait, star){
  const h = makeHero(elem, weap, trait, star||1);
  if(G.heroes.length >= 18){
    // 최저 별·최저 체력 영웅 정리 (합성 실패 시에만)
    let weak = null;
    for(const c of G.heroes) if(!weak || c.star < weak.star || (c.star===weak.star && c.hpMax < weak.hpMax)) weak = c;
    const wi = G.heroes.indexOf(weak);
    if(wi >= 0) G.heroes.splice(wi,1);
  }
  G.heroes.push(h);
  layoutHeroes();
  G.shake = Math.max(G.shake, 3);
  checkMerge();
  syncAll();
  return h;
}
function checkMerge(){
  let guard = 0;
  while(guard++ < 10){
    let target = null;
    for(let star=1; star<=MAX_STAR && !target; star++){
      for(const el of ['fire','ice','bolt']){
        const list = G.heroes.filter(h=>h.elem===el && h.star===star);
        if(list.length >= 3){ target = {el, star, list}; break; }
      }
    }
    if(!target) break;
    const three = target.list.slice(0,3);
    const idx = Math.min(...three.map(h=>G.heroes.indexOf(h)));
    const keep = three[0];
    three.forEach(h=>{ const i = G.heroes.indexOf(h); if(i>=0) G.heroes.splice(i,1); });
    const nextStar = Math.min(MAX_STAR, Math.max(...three.map(h=>h.star)) + 1);
    const awakened = nextStar === Math.max(...three.map(h=>h.star));
    const up = makeHero(keep.elem, keep.weap, keep.trait, nextStar);
    if(awakened){ // 최고 별에서 3합성 → 각성(영구 강화)
      up.atk *= 1.25; up.hpMax *= 1.25; up.hp = up.hpMax;
    }
    up.x = keep.x; up.y = keep.y;
    G.heroes.splice(Math.min(idx, G.heroes.length), 0, up);
    G.rings.push({x:up.x, y:up.y, r:8, life:.9, max:.9, color:'#ffd34d'});
    G.rings.push({x:up.x, y:up.y, r:4, life:1.15, max:1.15, color:'#fff6cf'});
    for(let i=0;i<16;i++){
      const a = rnd(0,6.28), s2 = rnd(40,150);
      G.parts.push({x:up.x, y:up.y, vx:Math.cos(a)*s2, vy:Math.sin(a)*s2-30, life:.7, max:.7,
        col: i%3===0?'#fff6cf':'#ffd34d', r: rnd(1.6,3.4), g:180});
    }
    G.texts.push({x:up.x, y:up.y-26, txt: awakened ? '각성!' : '★'+up.star+' 진화!', col:'#ffe07a', life:1.3, max:1.3, size:13, vy:-30});
    G.shake = 7; G.flash = .5;
    SFX.merge();
  }
  layoutHeroes();
}

/* ═══════════ 적 ═══════════ */
function enemySpec(wave, boss, flyer){
  const hp = TUNE.hpBase * Math.pow(TUNE.hpGrow, wave-1) * (boss ? 7 : 1) * (flyer ? .38 : 1) * rnd(.9,1.1);
  return {
    hp,
    spd: (boss ? 20 : rnd(26, 34)) * (1 + Math.min(.45, wave*TUNE.spdGrow)) * (flyer ? 1.95 : 1),
    boss: !!boss,
    flyer: !!flyer,
    atk: (TUNE.atkBase * Math.pow(TUNE.atkGrow, wave-1)) * (boss ? 2.4 : 1),
    wallDmg: (TUNE.wallBase + wave*TUNE.wallGrow) * (boss ? 2.6 : 1) * (flyer ? .55 : 1)
  };
}
function makeEnemy(spec){
  const grow = Math.min(3.2, (G.wave-1)*0.28);
  const r = spec.boss ? 22 + grow*0.6 : (spec.flyer ? 10.5 + grow*0.3 : 11.5 + grow);
  return {
    x: GEO.w + rnd(8,54), y: GEO.y + (spec.flyer ? rnd(-16,10) : rnd(-9,9)), lane:0,
    hp: spec.hp, hpMax: spec.hp, spd: spec.spd, boss: spec.boss, flyer: !!spec.flyer,
    atk: spec.atk, cd: 1.0, cdT: rnd(.2,1),
    wallDmg: spec.wallDmg, r, flash:0, bob: rnd(0,6.28),
    hoverX: spec.flyer ? Math.min(192, GEO.w*0.49) + rnd(26, 42) : 0,
    slowT:0, burn:{dps:0,t:0}, dead:false, born:0
  };
}
function addEnemy(spec){ const e = makeEnemy(spec); G.enemies.push(e); return e; }

/* ═══════════ 웨이브 ═══════════ */
function startWave(){
  const w = G.wave;
  G.waveOn = true; G.waveClearT = -1;
  const count = Math.min(28, TUNE.countBase + Math.round(w*TUNE.countGrow));
  G.queue = [];
  const ghostChance = w >= 3 ? Math.min(.24, .10 + w*.010) : 0;
  for(let i=0;i<count;i++){
    const isBoss = i === count-1 && w % 5 === 0;
    const flyer = !isBoss && w >= 3 && Math.random() < ghostChance;
    G.queue.push(enemySpec(w, isBoss, flyer));
  }
  G.spawnT = 0.55;
  showBanner('웨이브 ' + w, w%5===0 ? '👑 보스가 옵니다!' : (w===1 ? '룰렛을 돌려 영웅을 소환!' : '적이 몰려옵니다'));
  syncAll();
}
function showBanner(main, sub){
  bannerEl.querySelector('b').textContent = main;
  bannerEl.querySelector('span').textContent = sub || '';
  bannerEl.classList.add('show');
  clearTimeout(showBanner._t);
  showBanner._t = setTimeout(()=>bannerEl.classList.remove('show'), 1650);
}

/* ═══════════ 강화(3택1) ═══════════ */
const UPGRADES = [
  {id:'atk', ico:'up_atk',  t:'영웅 공격력 +20%', d:'모든 영웅의 공격력이 20% 증가합니다',
   apply(){ G.mods.atk *= 1.2; }},

   apply(){ G.mods.hp *= 1.25; G.heroes.forEach(h=>{ const s=heroStats(h.elem,h.weap,h.trait,h.star); h.hpMax=s.hp; h.hp=h.hpMax; }); }},
  {id:'wall', ico:'up_wall',t:'성벽 수리 +40', d:'성벽 체력을 40 회복합니다',
   apply(){ G.wall = Math.min(G.wallMax, G.wall+40); }},
  {id:'cool', ico:'up_cool',t:'연금술 냉각 -22%', d:'조합 버튼이 더 빨리 준비됩니다',
   apply(){ G.mods.cool *= 0.78; }},
  {id:'rr',  ico:'up_dice', t:'다시 뽑기 +1회', d:'한 번 더 재추첨할 수 있습니다',
   apply(){ G.rerollMax += 1; G.rerolls = G.rerollMax; }},
  {id:'elem', ico:'up_elem',t:'원소 위력 +35%', d:'화상 · 빙결 · 번개 효과가 강해집니다',
   apply(){ G.mods.elem *= 1.35; }},
  {id:'legend',ico:'up_crown',t:'전설 확률 UP', d:'전설 칸이 더 자주 나옵니다',
   apply(){ G.mods.legend += 0.18; }}
];
function openUpgrade(){
  if(G.phase !== 'play') return;
  if(G.wave >= WAVES_TOTAL){ winGame(); return; }
  G.phase = 'upgrade';
  SFX.upgrade();
  const opts = shuffle(UPGRADES.slice()).slice(0,3);
  G.offer = opts;
  cardsEl.innerHTML = '';
  opts.forEach(op=>{
    const b = document.createElement('button');
    b.className = 'card';
    b.innerHTML = '<span class="ci">' + ICON[op.ico] + '</span><span><b>' + op.t + '</b><small>' + op.d + '</small></span>';
    b.addEventListener('click', ()=>{
      op.apply();
      SFX.pick();
      upLayer.classList.add('hidden');
      G.phase = 'play';
      G.wave++;
      startWave();
      syncAll();
    }, {passive:true});
    cardsEl.appendChild(b);
  });
  upLayer.classList.remove('hidden');
  syncAll();
}

/* ═══════════ 게임 오버 / 재시작 ═══════════ */
function gameOver(){
  if(G.phase === 'over' || G.phase === 'win') return;
  G.phase = 'over';
  G.win = false;
  SFX.over();
  overIcon.innerHTML = ICON.blast;
  overIcon.classList.remove('win');
  overTitle.textContent = '성벽이 무너졌어요!';
  overTitle.classList.remove('win');
  overBtn.textContent = '다시 도전';
  overStat.innerHTML = '도달 <b>웨이브 ' + G.wave + '</b> · 처치 <b>' + G.kills + '</b><br>영웅 ' + G.heroes.length + '명과 함께 성벽을 지켰어요';
  overLayer.classList.remove('hidden');
  syncAll();
}
function winGame(){
  G.phase = 'win';
  G.win = true;
  SFX.born();
  [880,1109,1319,1760].forEach((f,i)=>tone(f,.3,'triangle',.09,null,i*.12));
  const best = G.heroes.reduce((a,h)=>Math.max(a,h.star),0);
  overIcon.innerHTML = ICON.legend;
  overIcon.classList.add('win');
  overStat.innerHTML = '웨이브 <b>' + WAVES_TOTAL + '</b> 모두 방어!<br>처치 <b>' + G.kills + '</b> · 최고 <b>★' + best + '</b> 영웅<br>성벽 체력 <b>' + Math.round(G.wall) + '</b>';
  overTitle.textContent = '성벽 방어 성공!';

}
function restart(){
  G.phase='play'; G.win=false; G.t=0; G.wave=1; G.wall=100; G.wallMax=100; G.kills=0;
  G.heroes=[]; G.enemies=[]; G.shots=[]; G.wallShots=[]; G.parts=[]; G.texts=[]; G.rings=[];
  G.queue=[]; G.spawnT=0; G.waveOn=false; G.waveClearT=-1;
  G.reels=[rndi(3),rndi(3),rndi(3)]; G.locked=-1; G.rerolls=1; G.rerollMax=1;
  G.cool=0; G.coolMax=1.5; G.spinning=0; G.mods={atk:1,hp:1,elem:1,cool:1,legend:0};

/* ═══════════ 조합 ═══════════ */
function combine(){
  if(G.phase !== 'play' || G.cool > 0 || G.spinning > 0) return;
  const elem = COLS[0][G.reels[0]], weap = COLS[1][G.reels[1]], trait = COLS[2][G.reels[2]];
  G.firstCombine = true;
  hintEl.classList.add('gone');
  G.cool = G.coolMax * G.mods.cool;
  brewFX(elem, weap, trait, ()=>{
    SFX.born();
    spawnHero(elem, weap, trait, 1);
  });
  G.locked = -1; syncLock();
  setTimeout(()=>{
    if(G.phase === 'over') return;
    G.rerolls = G.rerollMax;
    syncButtons();
    spinCols([0,1,2], ()=>{ syncButtons(); });
  }, 900);
  syncButtons();
}

function brewFX(elem, weap, trait, onBorn){
  const stageR = stage.getBoundingClientRect();
  const keys = [COLS[0][G.reels[0]], COLS[1][G.reels[1]], COLS[2][G.reels[2]]];
  const starts = reelEls.map(el=>{
    const r = el.querySelector('.ico').getBoundingClientRect();
    return {x:r.left - stageR.left + r.width/2, y:r.top - stageR.top + r.height/2};
  });
  const tx = stageR.width/2, ty = stageR.height*0.40;
  const sprites = [];
  keys.forEach((k,i)=>{
    const d = document.createElement('div');
    d.className = 'orb';
    d.innerHTML = ICON[k];
    d.style.left = starts[i].x + 'px';
    d.style.top = starts[i].y + 'px';
    d.style.transform = 'translate(-50%,-50%)';
    d.style.marginTop = '-23px'; d.style.marginLeft = '-23px';
    d.style.transitionDelay = (i*0.03) + 's';
    brewEl.appendChild(d);
    sprites.push(d);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const dx = tx - starts[i].x, dy = ty - starts[i].y;
      d.style.transform = 'translate(-50%,-50%) translate(' + (dx*0.94) + 'px,' + dy + 'px) scale(.62) rotate(' + (i%2?180:-180) + 'deg)';
    }));
  });

  const T = [];
  T.push(setTimeout(()=>{
    sprites.forEach(s=>{ s.style.opacity = '0'; });
    const b = document.createElement('div');
    b.className = 'burst'; b.style.left = tx+'px'; b.style.top = ty+'px';
    brewEl.appendChild(b);
    for(let i=0;i<12;i++){
      const a = rnd(0,6.28), dist = rnd(28,90);
      const p = document.createElement('div');
      p.className = 'bub';
      const sz = rnd(4,11);
      p.style.width = sz+'px'; p.style.height = sz+'px';
      p.style.left = tx+'px'; p.style.top = ty+'px';
      p.style.setProperty('--dx', (Math.cos(a)*dist).toFixed(1)+'px');
      p.style.setProperty('--dy', (Math.sin(a)*dist - 22).toFixed(1)+'px');
      p.style.animationDelay = (i*0.015)+'s';
      brewEl.appendChild(p);
    }
    G.flash = .45;
  }, 480));

  let bornEl = null;
  T.push(setTimeout(()=>{
    onBorn && onBorn();
    bornEl = document.createElement('div');
    bornEl.className = 'born';
    bornEl.style.left = tx+'px'; bornEl.style.top = ty+'px';
    bornEl.innerHTML = '<div class="bc">' + ICON[weap] + '</div><div class="bn" style="color:' + ELEM[elem].a + '">' + heroName(elem,weap,trait) + '</div>';
    brewEl.appendChild(bornEl);
  }, 545));

  T.push(setTimeout(()=>{ brewEl.innerHTML = ''; }, 1700));
  return T;
}

/* ═══════════ 렌더링 ═══════════ */
function drawBG(g){
  const hz = g.horizon;
  // 하늘(실내 연금술실)
  const grd = ctx.createLinearGradient(0,0,0,hz+40);
  grd.addColorStop(0,'#2c1e52'); grd.addColorStop(.55,'#1d1438'); grd.addColorStop(1,'#171029');
  ctx.fillStyle = grd; ctx.fillRect(0,0,g.w,hz+40);

  // 별/먼지
  ctx.save();
  for(let i=0;i<26;i++){
    const sx = (i*137.5 + Math.sin(i+G.seed)*40) % g.w;
    const sy = (i*61.7 + (G.t*6 + i*9) % Math.max(1,hz)) % Math.max(1,hz);
    ctx.globalAlpha = .10 + .12*Math.abs(Math.sin(i*1.7 + G.t*.6));
    ctx.fillStyle = '#cdb8ff';
    ctx.beginPath(); ctx.arc(sx, sy, 1 + (i%3)*.6, 0, 6.283); ctx.fill();
  }
  ctx.restore();

  // 연금술 룬 원
  ctx.save();
  ctx.globalAlpha = .17;
  ctx.strokeStyle = '#a98cff'; ctx.lineWidth = 1.2;
  const cx = g.w*0.52, cy = hz*0.52;
  [54, 72, 92].forEach(r=>{ ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.stroke(); });
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = i/6*6.283 + G.t*0.07;
    const x = cx + Math.cos(a)*92, y = cy + Math.sin(a)*92;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();

  // ── 바닥(원근 격자) ──
  const fg = ctx.createLinearGradient(0, hz, 0, g.h);
  fg.addColorStop(0,'#221647'); fg.addColorStop(.45,'#1a1136'); fg.addColorStop(1,'#0d0a1c');
  ctx.fillStyle = fg; ctx.fillRect(0, hz, g.w, g.h-hz);
  // 지평선 안개
  const hg = ctx.createLinearGradient(0, hz-26, 0, hz+34);
  hg.addColorStop(0,'rgba(120,92,200,0)'); hg.addColorStop(.6,'rgba(126,96,205,.22)'); hg.addColorStop(1,'rgba(120,92,200,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, hz-26, g.w, 60);
  // 원근 격자
  ctx.save();
  ctx.strokeStyle = 'rgba(150,120,225,.16)'; ctx.lineWidth = 1;
  const vpX = g.w*0.52;
  for(let i=-7;i<=7;i++){
    ctx.beginPath(); ctx.moveTo(vpX + i*10, hz); ctx.lineTo(vpX + i*62, g.h+20); ctx.stroke();
  }
  for(let i=1;i<=6;i++){
    const t = i/6, y = hz + (g.h-hz)*t*t*1.05;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(g.w, y); ctx.stroke();
  }
  ctx.restore();

  // 전장 라인 (영웅/적이 서는 길)
  ctx.save();
  const band = ctx.createLinearGradient(0, g.y-46, 0, g.y+46);
  band.addColorStop(0,'rgba(255,215,140,0)'); band.addColorStop(.5,'rgba(255,215,140,.075)'); band.addColorStop(1,'rgba(255,215,140,0)');
  ctx.fillStyle = band; ctx.fillRect(0, g.y-46, g.w, 92);
  ctx.restore();

  // 오른쪽 균열(적 생성구)
  ctx.save();
  const rg = ctx.createRadialGradient(g.w-2, g.y-6, 2, g.w-2, g.y-6, 62);
  rg.addColorStop(0,'rgba(190,120,255,.42)'); rg.addColorStop(.45,'rgba(140,70,220,.16)'); rg.addColorStop(1,'rgba(120,60,200,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.ellipse(g.w-4, g.y-4, 40, 58, 0, 0, 6.283); ctx.fill();
  ctx.strokeStyle = 'rgba(205,160,255,'+(0.35+0.2*Math.sin(G.t*3))+')'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(g.w-6, g.y-4, 16, 40, 0, -1.2, 1.2); ctx.stroke();
  ctx.restore();

  // 좌측 성벽
  const wallW = 34;
  const wg = ctx.createLinearGradient(0,0,wallW,0);
  wg.addColorStop(0,'#3b2c63'); wg.addColorStop(1,'#241a45');
  ctx.fillStyle = wg; ctx.fillRect(0, 0, wallW, g.h);
  ctx.save();
  ctx.strokeStyle = 'rgba(150,120,220,.28)'; ctx.lineWidth = 1;
  for(let y=12; y<g.h; y+=26){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(wallW,y); ctx.stroke();
    const off = ((y/26)|0)%2 ? 0 : 12;
    ctx.beginPath(); ctx.moveTo(off+8,y); ctx.lineTo(off+8,y+26); ctx.stroke();
  }
  ctx.restore();
  // 성벽 수호석
  const glow = clamp(G.wall/G.wallMax,0,1);
  ctx.save();
  const cg = ctx.createRadialGradient(wallW*0.5, g.y-2, 1, wallW*0.5, g.y-2, 22);
  cg.addColorStop(0, glow > .35 ? 'rgba(99,232,154,.85)' : 'rgba(255,107,107,.9)');
  cg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(wallW*0.5, g.y-2, 22, 0, 6.283); ctx.fill();
  ctx.fillStyle = glow > .35 ? '#8dffbd' : '#ff9a9a';
  ctx.beginPath(); ctx.arc(wallW*0.5, g.y-2, 2.6+glow*1.6, 0, 6.283); ctx.fill();
  ctx.restore();
  // 성벽 피격 표시
  if(G.wallFlash > 0){
    ctx.save();
    ctx.globalAlpha = G.wallFlash*0.5;
    ctx.fillStyle = '#ff3b3b'; ctx.fillRect(0,0,wallW,g.h);
    ctx.restore();
  }
}

function drawProps(g){
  const W = g.w, fy = g.h;
  const groundY = fy - 18;

  // 바닥 그늘
  const vg = ctx.createLinearGradient(0, fy-120, 0, fy);
  vg.addColorStop(0,'rgba(8,5,18,0)'); vg.addColorStop(1,'rgba(8,5,18,.7)');
  ctx.fillStyle = vg; ctx.fillRect(0, fy-120, W, 120);

  // ── 가마솥 ──
  const cx = 88, cyy = groundY - 30;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.ellipse(cx, groundY+4, 46, 9, 0, 0, 6.283); ctx.fill();
  // 다리
  ctx.strokeStyle = '#221a3d'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx-24, cyy+22); ctx.lineTo(cx-31, groundY+2);
  ctx.moveTo(cx+24, cyy+22); ctx.lineTo(cx+31, groundY+2); ctx.stroke();
  // 몸통
  const pot = ctx.createLinearGradient(cx-40, cyy-20, cx+30, cyy+26);
  pot.addColorStop(0,'#5b4788'); pot.addColorStop(.55,'#3b2c5e'); pot.addColorStop(1,'#221a3d');
  ctx.fillStyle = pot;
  ctx.beginPath();
  ctx.moveTo(cx-40, cyy-10);
  ctx.bezierCurveTo(cx-44, cyy+24, cx-24, cyy+30, cx, cyy+30);
  ctx.bezierCurveTo(cx+24, cyy+30, cx+44, cyy+24, cx+40, cyy-10);
  ctx.closePath(); ctx.fill();
  // 손잡이
  ctx.strokeStyle = '#2a2049'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(cx-42, cyy-4, 7, -0.6, 1.8); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx+42, cyy-4, 7, 1.3, 3.7); ctx.stroke();
  // 입구
  ctx.fillStyle = '#1b1334';
  ctx.beginPath(); ctx.ellipse(cx, cyy-10, 40, 9, 0, 0, 6.283); ctx.fill();
  // 액체
  const liq = ctx.createRadialGradient(cx, cyy-10, 1, cx, cyy-10, 38);
  liq.addColorStop(0,'rgba(160,255,210,.95)'); liq.addColorStop(.6,'rgba(60,225,175,.6)'); liq.addColorStop(1,'rgba(40,170,140,0)');
  ctx.fillStyle = liq;
  ctx.beginPath(); ctx.ellipse(cx, cyy-10, 37, 7, 0, 0, 6.283); ctx.fill();
  // 거품/김
  for(let i=0;i<6;i++){
    const t = G.t*1.35 + i*1.8;
    const bx = cx + Math.sin(t*1.1+i)*20;
    const by = cyy-16 - ((t*15 + i*9) % 34);
    ctx.globalAlpha = Math.max(0, .45 * (1 - (cyy-16-by)/34));
    ctx.fillStyle = '#c9ffe8';
    ctx.beginPath(); ctx.arc(bx, by, 1.5 + (i%3)*.7, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // ── 물약병들 ──
  const bottles = [[W-78, 30, '#8f6bff'], [W-48, 40, '#5ee0c0'], [W-20, 24, '#ff9b4a']];
  bottles.forEach(([bx, h, col])=>{
    ctx.save();
    ctx.translate(bx, groundY);
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath(); ctx.ellipse(0, 2, 11, 3.4, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(225,238,255,.14)';
    ctx.beginPath(); ctx.roundRect(-9, -h, 18, h, 5); ctx.fill();
    const lg = ctx.createLinearGradient(0, -h*0.45, 0, 0);
    lg.addColorStop(0, col); lg.addColorStop(1, 'rgba(0,0,0,.15)');
    ctx.globalAlpha = .75; ctx.fillStyle = lg;
    ctx.beginPath(); ctx.roundRect(-7.5, -h*0.46, 15, h*0.44, 3); ctx.fill();
    ctx.globalAlpha = .3; ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(0, -h*0.46, 20, 14, 0, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(235,245,255,.32)';
    ctx.beginPath(); ctx.roundRect(-3.5, -h-9, 7, 10, 2.5); ctx.fill();
    ctx.strokeStyle = 'rgba(205,225,255,.26)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(-9, -h, 18, h, 5); ctx.stroke();
    ctx.restore();
  });
}

function drawHero(h){
  const st = h.star;
  const r = 12 + (st-1)*3.8 + (h.weap==='sword'?1.5:0);
  const bob = Math.sin(G.t*2.6 + h.seed)*1.4;
  const cx = h.x, cy = h.y + bob;
  const E = ELEM[h.elem];

  // 그림자
  ctx.save();
  ctx.globalAlpha = .34; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(cx, h.y + r*0.92, r*0.88, r*0.3, 0, 0, 6.283); ctx.fill();
  ctx.restore();

  // 전설 오라
  if(h.trait === 'legend'){
    const ag = ctx.createRadialGradient(cx, cy, r*0.4, cx, cy, r*2.0);
    ag.addColorStop(0,'rgba(255,215,90,.40)'); ag.addColorStop(1,'rgba(255,215,90,0)');
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(cx, cy, r*2.0, 0, 6.283); ctx.fill();
  }

  // 무기 (몸 뒤에 들고 있는 형태)
  ctx.save();
  const wx = cx + r*0.66, wy = cy + r*0.16;
  if(h.weap === 'sword'){
    ctx.translate(wx, wy); ctx.rotate(-0.34);
    ctx.fillStyle = '#e6eefc';
    ctx.beginPath();
    ctx.moveTo(0,-r*0.95); ctx.lineTo(r*0.14,-r*0.66); ctx.lineTo(r*0.14, r*0.30);
    ctx.lineTo(0, r*0.46); ctx.lineTo(-r*0.14, r*0.30); ctx.lineTo(-r*0.14,-r*0.66);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.moveTo(0,-r*0.9); ctx.lineTo(r*0.06,-r*0.66);
    ctx.lineTo(r*0.06, r*0.28); ctx.lineTo(0, r*0.4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f5b942'; ctx.fillRect(-r*0.26, r*0.26, r*0.52, r*0.14);
    ctx.fillStyle = '#a9713f'; ctx.fillRect(-r*0.06, r*0.38, r*0.12, r*0.34);
    ctx.fillStyle = '#f5b942'; ctx.beginPath(); ctx.arc(0, r*0.74, r*0.11, 0, 6.283); ctx.fill();
  } else if(h.weap === 'bow'){
    ctx.translate(wx, wy); ctx.rotate(-0.12);
    ctx.strokeStyle = '#d29a63'; ctx.lineWidth = r*0.14; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, r*0.62, -1.18, 1.18); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.62)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.cos(-1.18)*r*0.62, Math.sin(-1.18)*r*0.62);
    ctx.lineTo(Math.cos(1.18)*r*0.62, Math.sin(1.18)*r*0.62);
    ctx.stroke();
    ctx.strokeStyle = '#8a6234'; ctx.lineWidth = r*0.09;
    ctx.beginPath(); ctx.moveTo(-r*0.12, 0); ctx.lineTo(r*0.72, 0); ctx.stroke();
  } else {
    ctx.translate(wx, wy); ctx.rotate(0.2);
    ctx.strokeStyle = '#b07a45'; ctx.lineWidth = r*0.15; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, r*0.78); ctx.lineTo(-r*0.02, -r*0.62); ctx.stroke();
    const gem = h.elem==='ice' ? '#8fe4ff' : h.elem==='bolt' ? '#d3a6ff' : '#ffb34d';
    ctx.fillStyle = gem;
    ctx.beginPath(); ctx.arc(-r*0.02, -r*0.78, r*0.26, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.arc(-r*0.10, -r*0.86, r*0.09, 0, 6.283); ctx.fill();
  }
  ctx.restore();

  // 망토
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.15)';
  ctx.beginPath();
  ctx.moveTo(cx-r*.75, cy-r*.15); ctx.lineTo(cx-r*1.42, cy+r*1.05); ctx.lineTo(cx-r*.05, cy+r*.7);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // 몸통
  const bg = ctx.createRadialGradient(cx-r*.35, cy-r*.45, r*.2, cx, cy, r*1.15);
  bg.addColorStop(0, E.a); bg.addColorStop(.55, E.ring); bg.addColorStop(1, E.b);
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.fill();

  // 별 테두리
  if(st >= 2){
    ctx.strokeStyle = st===3 ? '#ffe06a' : 'rgba(235,244,255,.9)';
    ctx.lineWidth = st===3 ? 2.6 : 1.7;
    ctx.beginPath(); ctx.arc(cx, cy, r-1, 0, 6.283); ctx.stroke();
  }

  // 얼굴
  ctx.fillStyle = 'rgba(20,10,35,.86)';
  const ey = cy - r*0.14, ex = r*0.33;
  ctx.beginPath(); ctx.ellipse(cx-ex, ey, r*.14, r*.20, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+ex, ey, r*.14, r*.20, 0, 0, 6.283); ctx.fill();
  ctx.strokeStyle = 'rgba(20,10,35,.72)'; ctx.lineWidth = Math.max(1, r*.085);
  ctx.beginPath(); ctx.arc(cx, ey + r*.32, r*.24, .28, Math.PI-.28); ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,160,.32)';
  ctx.beginPath(); ctx.ellipse(cx-r*.6, ey+r*.3, r*.19, r*.12, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+r*.6, ey+r*.3, r*.19, r*.12, 0, 0, 6.283); ctx.fill();

  // 수호 방패 표식
  if(h.trait === 'guard'){
    ctx.save();
    ctx.strokeStyle = 'rgba(150,225,255,.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r+3.4, 2.35, 4.95); ctx.stroke();
    ctx.restore();
  }
  // 폭발 표식
  if(h.trait === 'blast'){
    ctx.save();
    ctx.fillStyle = 'rgba(255,120,90,.75)';
    for(let i=0;i<3;i++){
      const a = G.t*2.4 + i*2.1;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a)*(r+4), cy + Math.sin(a)*(r+4), 1.5, 0, 6.283);
      ctx.fill();
    }
    ctx.restore();
  }

  // 별 배지 (★2 이상)
  if(st >= 2){
    ctx.save();
    const bx = cx + r*0.58, by = cy + r*0.82, br = 5.4;
    const bg2 = ctx.createLinearGradient(bx, by-br, bx, by+br);
    bg2.addColorStop(0,'#ffe98f'); bg2.addColorStop(1,'#ffb31f');
    ctx.fillStyle = bg2;
    ctx.beginPath(); ctx.arc(bx, by, br, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(90,50,0,.55)'; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#4a2700';
    ctx.font = '900 8px system-ui, "Noto Sans CJK KR", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(st), bx, by + 0.5);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  // 체력바
  if(h.hp < h.hpMax - .01){
    const w = r*1.8, hh = 2.6, yy = cy - r - 7;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath(); ctx.roundRect(cx-w/2, yy, w, hh, 2); ctx.fill();
    const p = clamp(h.hp/h.hpMax,0,1);
    ctx.fillStyle = p>.5 ? '#5be48b' : p>.25 ? '#ffd34d' : '#ff5b5b';
    ctx.beginPath(); ctx.roundRect(cx-w/2, yy, w*p, hh, 2); ctx.fill();
  }
  // 피격
  if(h.flash > 0){
    ctx.save(); ctx.globalAlpha = h.flash*2.2; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.fill(); ctx.restore();
  }
}

function drawGhost(e){
  const r = e.r;
  const bob = Math.sin(G.t*3 + e.bob)*3;
  const cx = e.x, cy = e.y + bob;
  ctx.save();
  ctx.globalAlpha = .30; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(cx, e.y + r*1.25, r*.7, r*.2, 0, 0, 6.283); ctx.fill();
  ctx.restore();

  ctx.save();
  // 후광
  const hg = ctx.createRadialGradient(cx, cy, r*.3, cx, cy, r*2.1);
  hg.addColorStop(0,'rgba(180,225,255,.42)'); hg.addColorStop(1,'rgba(140,200,255,0)');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(cx, cy, r*2.1, 0, 6.283); ctx.fill();
  // 몸통
  ctx.globalAlpha = .88;
  const bg = ctx.createLinearGradient(cx, cy-r*1.2, cx, cy+r*1.2);
  bg.addColorStop(0,'#ffffff'); bg.addColorStop(.55,'#dceaff'); bg.addColorStop(1,'#a9c8ff');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(cx, cy - r*.15, r, Math.PI, 0);
  ctx.lineTo(cx + r, cy + r*.75);
  const waves = 3;
  for(let i=waves;i>=0;i--){
    const x1 = cx - r + (2*r)*(i/waves);
    const x2 = cx - r + (2*r)*((i+0.5)/waves);
    if(i === waves) ctx.quadraticCurveTo(x2, cy + r*1.15, x1, cy + r*.75);
    else ctx.quadraticCurveTo(x2, cy + r*1.15, x1, cy + r*.75);
  }
  ctx.closePath(); ctx.fill();
  // 눈
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#3a2f63';
  ctx.beginPath(); ctx.ellipse(cx-r*.34, cy-r*.25, r*.16, r*.22, 0,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+r*.34, cy-r*.25, r*.16, r*.22, 0,0,6.283); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.arc(cx-r*.29, cy-r*.32, r*.06, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+r*.39, cy-r*.32, r*.06, 0, 6.283); ctx.fill();
  ctx.fillStyle = 'rgba(60,45,100,.9)';
  ctx.beginPath(); ctx.ellipse(cx, cy+r*.25, r*.16, r*.22, 0, 0, 6.283); ctx.fill();
  ctx.restore();

  // 상태이상
  if(e.burn.t > 0){
    ctx.save(); ctx.globalAlpha = .8; ctx.fillStyle = '#ff8a3d';
    for(let i=0;i<3;i++){
      const fx = cx + Math.sin(G.t*9+i*2)*r*.7, fy = cy - r*.8 - i*4;
      ctx.beginPath(); ctx.arc(fx, fy, 2 - i*.3, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }
  if(e.slowT > 0){
    ctx.save(); ctx.globalAlpha = .3; ctx.fillStyle = '#7fd8ff';
    ctx.beginPath(); ctx.arc(cx, cy, r*1.05, 0, 6.283); ctx.fill(); ctx.restore();
  }
  if(e.hp < e.hpMax - .01){
    const w = r*2.0, hh = 2.6, yy = cy - r*1.25 - 8;
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.beginPath(); ctx.roundRect(cx-w/2, yy, w, hh, 2); ctx.fill();
    ctx.fillStyle = '#9fd8ff';
    ctx.fillRect(cx-w/2, yy, w*clamp(e.hp/e.hpMax,0,1), hh);
  }
  if(e.flash > 0){
    ctx.save(); ctx.globalAlpha = e.flash*3; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.fill(); ctx.restore();
  }
}

function drawEnemy(e){
  if(e.flyer){ drawGhost(e); return; }
  const bob = Math.sin(G.t*4 + e.bob)*1.2;
  const cx = e.x, cy = e.y + bob;
  const r = e.r;
  const sq = 1 + Math.sin(G.t*5 + e.bob)*0.05;
  ctx.save();
  ctx.globalAlpha = .3; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(cx, e.y + r*.85, r*.8, r*.26, 0,0,6.283); ctx.fill();
  ctx.restore();

  const col1 = e.boss ? '#ff8fa8' : '#a98bff';
  const col2 = e.boss ? '#c1214a' : '#5b3aa8';
  const bgr = ctx.createRadialGradient(cx-r*.3, cy-r*.4, r*.15, cx, cy, r*1.1);
  bgr.addColorStop(0, col1); bgr.addColorStop(1, col2);
  ctx.fillStyle = bgr;
  ctx.beginPath();
  ctx.moveTo(cx-r*sq, cy+r*.55);
  ctx.bezierCurveTo(cx-r*1.05, cy-r*1.15, cx+r*1.05, cy-r*1.15, cx+r*sq, cy+r*.55);
  ctx.bezierCurveTo(cx+r*.6, cy+r*1.05, cx-r*.6, cy+r*1.05, cx-r*sq, cy+r*.55);
  ctx.closePath(); ctx.fill();

  if(e.boss){
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath();
    ctx.moveTo(cx-r*.7, cy-r*.85); ctx.lineTo(cx-r*.45, cy-r*1.5); ctx.lineTo(cx-r*.2, cy-r*.95);
    ctx.lineTo(cx, cy-r*1.55); ctx.lineTo(cx+r*.2, cy-r*.95); ctx.lineTo(cx+r*.45, cy-r*1.5);
    ctx.lineTo(cx+r*.7, cy-r*.85); ctx.closePath(); ctx.fill();
  }
  // 눈
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(cx-r*.33, cy-r*.1, r*.22, r*.26, 0,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+r*.33, cy-r*.1, r*.22, r*.26, 0,0,6.283); ctx.fill();
  ctx.fillStyle = '#1b1030';
  ctx.beginPath(); ctx.arc(cx-r*.38, cy-r*.1, r*.11, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+r*.28, cy-r*.1, r*.11, 0, 6.283); ctx.fill();
  // 입
  ctx.strokeStyle = 'rgba(25,12,45,.8)'; ctx.lineWidth = Math.max(1, r*.09);
  ctx.beginPath(); ctx.arc(cx, cy+r*.28, r*.3, .15, Math.PI-.15); ctx.stroke();

  // 상태이상
  if(e.burn.t > 0){
    ctx.save(); ctx.globalAlpha = .8; ctx.fillStyle = '#ff8a3d';
    for(let i=0;i<3;i++){
      const fx = cx + Math.sin(G.t*9+i*2)*r*.7, fy = cy - r*.7 - i*4 + Math.cos(G.t*7+i)*2;
      ctx.beginPath(); ctx.arc(fx, fy, 2.2 - i*.4, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }
  if(e.slowT > 0){
    ctx.save(); ctx.globalAlpha = .35; ctx.fillStyle = '#7fd8ff';
    ctx.beginPath(); ctx.arc(cx, cy, r*1.02, 0, 6.283); ctx.fill(); ctx.restore();
  }

  if(e.hp < e.hpMax - .01){
    const w = r*2.0, hh = 3, yy = cy - r*1.05 - 8;
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.beginPath(); ctx.roundRect(cx-w/2, yy, w, hh, 2); ctx.fill();
    const p = clamp(e.hp/e.hpMax,0,1);
    ctx.fillStyle = p>.5 ? '#ff7b7b' : '#ff3b3b';
    ctx.fillRect(cx-w/2, yy, w*p, hh);
  }
  if(e.flash > 0){
    ctx.save(); ctx.globalAlpha = e.flash*3; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.fill(); ctx.restore();
  }
}

function drawShots(){
  G.shots.forEach(s=>{
    const col = s.elem==='fire' ? '#ff9b4a' : l(s.elem==='ice' ? '#8fe4ff' : '#c9a3ff');
    const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 9);
    grd.addColorStop(0,'#fff'); grd.addColorStop(.4, col); grd.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(s.x, s.y, 9, 0, 6.283); ctx.fill();
    // 잔상
    ctx.save(); ctx.globalAlpha = .3; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(s.x - s.vx*0.012, s.y - s.vy*0.012, 5.5, 0, 6.283); ctx.fill();
    ctx.restore();
  });
}
function l(c){ return c; } // (자리표시)

function drawWallShots(){
  G.wallShots.forEach(w=>{
    const grd = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, 8);
    grd.addColorStop(0,'#ffffff'); grd.addColorStop(.35,'#cfe6ff'); grd.addColorStop(1,'rgba(150,200,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(w.x, w.y, 8, 0, 6.283); ctx.fill();
    ctx.save(); ctx.globalAlpha = .35; ctx.fillStyle = '#9fd8ff';
    ctx.beginPath(); ctx.arc(w.x + 10, w.y - 2, 4, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(w.x + 18, w.y + 1, 2.5, 0, 6.283); ctx.fill();
    ctx.restore();
  });
}

function drawFX(){
  // 링
  G.rings.forEach(r=>{
    const p = 1 - r.life/r.max;
    ctx.save();
    ctx.globalAlpha = (1-p)*0.9;
    ctx.strokeStyle = r.color; ctx.lineWidth = 4*(1-p)+1;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r + p*54, 0, 6.283); ctx.stroke();
    ctx.restore();
  });
  // 파티클
  G.parts.forEach(p=>{
    const a = clamp(p.life/p.max,0,1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*a+0.4, 0, 6.283); ctx.fill();
    ctx.restore();
  });
  // 텍스트
  G.texts.forEach(t=>{
    const a = clamp(t.life/t.max,0,1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = t.col;
    ctx.font = '800 ' + (t.size||11) + 'px system-ui, "Noto Sans CJK KR", sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 4;
    ctx.fillText(t.txt, t.x, t.y);
    ctx.restore();
  });
}

function draw(){
  const g = GEO;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,g.w,g.h);
  let sx = 0, sy = 0;
  if(G.shake > 0){ sx = rnd(-G.shake,G.shake); sy = rnd(-G.shake,G.shake); }
  ctx.save(); ctx.translate(sx, sy);
  drawBG(g);
  drawProps(g);
  G.enemies.forEach(drawEnemy);
  G.heroes.forEach(drawHero);
  drawShots();
  drawWallShots();
  drawFX();
  ctx.restore();

  // 피격 플래시
  if(G.flash > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(.5, G.flash*.7);
    ctx.fillStyle = '#ffe9b0';
    ctx.fillRect(0,0,g.w,g.h);
    ctx.restore();
  }
  // 위험 비네트
  if(G.wall/G.wallMax < .35 && G.phase !== 'over'){
    const v = ctx.createRadialGradient(g.w/2,g.h/2,Math.min(g.w,g.h)*0.3,g.w/2,g.h/2,Math.max(g.w,g.h)*0.75);
    v.addColorStop(0,'rgba(255,40,40,0)'); v.addColorStop(1,'rgba(255,40,40,'+(0.22 + 0.12*Math.sin(G.t*4))+')');
    ctx.fillStyle = v; ctx.fillRect(0,0,g.w,g.h);
  }
}

/* ═══════════ 업데이트 ═══════════ */
function nearestEnemyInFront(h){
  let best = null, bd = 1e9;
  for(const e of G.enemies){
    const d = e.x - h.x;
    if(d > -8 && d < h.range && d < bd){ bd = d; best = e; }
  }
  return best;
}
function damageEnemy(e, dmg, fromElem){
  if(e.dead) return;
  e.hp -= dmg; e.flash = .16;
  G.texts.push({x:e.x + rnd(-4,4), y:e.y - e.r - 6, txt: String(Math.round(dmg)), col:'#fff0c4', life:.55, max:.55, size:10, vy:-26});
  if(e.hp <= 0){
    e.dead = true;
    G.kills++;
    SFX.pop();
    for(let i=0;i<7;i++){
      const a = rnd(0,6.28), s = rnd(30,110);
      G.parts.push({x:e.x, y:e.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-20, life:.5, max:.5,
        col: e.boss ? '#ffd34d' : '#b9a0ff', r: rnd(1.4,3), g:220});
    }
    const i = G.enemies.indexOf(e);
    if(i >= 0) G.enemies.splice(i,1);
    if(e.boss){ G.shake = 9; G.flash = .6; G.rings.push({x:e.x,y:e.y,r:10,life:.8,max:.8,color:'#ffd34d'}); }
    syncHUD();
  }
}
function heroAttack(h, tgt){
  h.cdT = h.cd;
  const em = G.mods.elem;
  if(h.weap === 'sword'){
    const dmg = h.atk;
    damageEnemy(tgt, dmg, h.elem);
    if(h.splash > 0) splash(tgt, h.splash, dmg*.55);
    applyElem(h, tgt, em);
    SFX.hit();
    G.rings.push({x:(h.x+tgt.x)/2, y:tgt.y, r:2, life:.18, max:.18, color:ELEM[h.elem].ring});
  } else {
    const dmg = h.atk;
    const speed = h.weap === 'bow' ? 600 : 460;
    G.shots.push({x:h.x+8, y:h.y-4, target:tgt, elem:h.elem, dmg, splash:h.splash, speed, vx:speed, vy:0, hero:h});
  }
}
function applyElem(h, tgt, em){
  if(h.elem === 'fire'){
    tgt.burn = {dps: 2.6*em*(1+ (h.star-1)*0.6), t: Math.max(tgt.burn.t, 3)};
  } else if(h.elem === 'ice'){
    tgt.slowT = Math.max(tgt.slowT, 2.0);
  } else if(h.elem === 'bolt'){
    // 연쇄 번개: 주변 다른 적 1명
    const other = G.enemies.find(e=>e !== tgt && Math.abs(e.x - tgt.x) < 80 && e.x > h.x - 10);
    if(other){
      other.hp -= h.atk*0.5*em; other.flash = .16;
      G.rings.push({x:(tgt.x+other.x)/2, y:tgt.y, r:3, life:.2, max:.2, color:'#d9b3ff'});
      if(other.hp <= 0) damageEnemy(other, 0.01, 'bolt');
    }
  }
}
function splash(tgt, radius, dmg){
  for(const e of G.enemies.slice()){
    if(e === tgt) continue;
    if(Math.abs(e.x - tgt.x) < radius && Math.abs(e.y - tgt.y) < 26){
      e.hp -= dmg; e.flash = .14;
      if(e.hp <= 0) damageEnemy(e, 0.01, 'splash');
    }
  }
  G.rings.push({x:tgt.x, y:tgt.y, r:4, life:.3, max:.3, color:'#ffb35c'});
}

function update(dt){
  G.t += dt;
  G.flash = Math.max(0, G.flash - dt*2.4);
  G.shake = Math.max(0, G.shake - dt*40);
  G.wallFlash = Math.max(0, (G.wallFlash||0) - dt*2.6);

  if(G.phase === 'over'){ updateFX(dt); return; }
  if(G.phase === 'upgrade' || G.phase === 'win'){ updateFX(dt); return; }

  // 쿨다운
  if(G.cool > 0){
    G.cool = Math.max(0, G.cool - dt);
    if(G.cool === 0) syncButtons();
  }
  cdEl.style.transform = 'scaleX(' + (G.cool>0 ? G.cool/(G.coolMax*G.mods.cool) : 0) + ')';

  // 스폰
  if(G.waveOn && G.queue.length){
    G.spawnT -= dt;
    if(G.spawnT <= 0){
      addEnemy(G.queue.shift());
      const base = Math.max(0.42, 0.92 - G.wave*0.02);
      G.spawnT = base * rnd(.8,1.2);
    }
  }

  // 영웅
  for(const h of G.heroes){
    h.flash = Math.max(0, h.flash - dt*5);
    h.cdT -= dt;
    if(h.cdT <= 0){
      const tgt = nearestEnemyInFront(h);
      if(tgt) heroAttack(h, tgt);
    }
  }

  // 투사체
  for(let i=G.shots.length-1;i>=0;i--){
    const s = G.shots[i];
    if(!s.target || s.target.dead || G.enemies.indexOf(s.target) < 0){
      s.x += 120*dt; s.y -= 30*dt;
      if(s.x > GEO.w + 30) G.shots.splice(i,1);
      continue;
    }
    const tx = s.target.x, ty = s.target.y - 2;
    const dx = tx - s.x, dy = ty - s.y;
    const d = Math.hypot(dx,dy) || 1;
    const step = s.speed*dt;
    s.vx = dx/d*s.speed; s.vy = dy/d*s.speed;
    if(d <= step){
      const tgt = s.target;
      damageEnemy(tgt, s.dmg, s.elem);
      if(s.splash > 0){ splash(tgt, s.splash, s.dmg*0.6); SFX.hit(); }
      applyElem(s.hero, tgt, G.mods.elem);
      if(s.elem === 'fire'){
        G.parts.push({x:tgt.x,y:tgt.y,vx:0,vy:-30,life:.3,max:.3,col:'#ffb35c',r:3,g:60});
      }
      G.shots.splice(i,1);
    } else {
      s.x += dx/d*step; s.y += dy/d*step;
    }
  }

  // 유령의 벽 저주
  for(let i=G.wallShots.length-1;i>=0;i--){
    const w = G.wallShots[i];
    w.x += w.vx*dt;
    if(w.x <= 40){
      G.wall -= w.dmg;
      G.wallFlash = 1; G.shake = 4;
      G.texts.push({x:46, y:w.y-16, txt:'-'+Math.round(w.dmg), col:'#9fd8ff', life:.8, max:.8, size:10.5, vy:-22});
      for(let k=0;k<6;k++){
        const a = rnd(0,6.28);
        G.parts.push({x:42,y:w.y,vx:Math.cos(a)*rnd(20,60),vy:Math.sin(a)*rnd(20,60),life:.5,max:.5,col:'#cfe6ff',r:rnd(1.2,2.6),g:30});
      }
      G.wallShots.splice(i,1);
      SFX.wallHit(); syncHUD();
      if(G.wall <= 0){ G.wall = 0; gameOver(); return; }
    }
  }

  // 적
  for(let i=G.enemies.length-1;i>=0;i--){
    const e = G.enemies[i];
    e.flash = Math.max(0, e.flash - dt*6);
    e.cdT -= dt;
    if(e.burn.t > 0){
      e.burn.t -= dt;
      e.hp -= e.burn.dps*dt;
      if(Math.random() < dt*8){
        G.parts.push({x:e.x+rnd(-6,6), y:e.y-rnd(2,10), vx:rnd(-8,8), vy:-rnd(20,45), life:.35, max:.35, col:'#ff8a3d', r:rnd(1,2.2), g:40});
      }
      if(e.hp <= 0){ damageEnemy(e, 0.01, 'burn'); continue; }
    }
    if(e.slowT > 0) e.slowT -= dt;
    const spd = e.spd * (e.slowT > 0 ? 0.45 : 1);

    // 유령: 공중에서 멈춰 성벽에 저주를 던진다
    if(e.flyer){
      if(e.x > e.hoverX){
        e.x -= spd*dt;
      } else if(e.cdT <= 0){
        e.cdT = 2.5;
        G.wallShots.push({x:e.x-6, y:e.y+2, vx:-320, dmg:e.wallDmg*0.55, seed:rnd(0,6.28)});
        tone(320,.12,'sine',.05,180);
      }
      continue;
    }

    // 앞에 있는 영웅 찾기 (가장 오른쪽)
    let front = null;
    for(const h of G.heroes){ if(h.x < e.x + 2 && (!front || h.x > front.x)) front = h; }

    if(front && e.x - front.x <= 24){
      // 영웅 공격
      if(e.cdT <= 0){
        e.cdT = 1.0;
        const dmg = e.atk * (1 - front.dr);
        front.hp -= dmg; front.flash = .5;
        G.texts.push({x:front.x, y:front.y-front.r-12, txt:'-'+Math.round(dmg), col:'#ff9a9a', life:.5, max:.5, size:9.5, vy:-22});
        if(front.hp <= 0){
          const idx = G.heroes.indexOf(front);
          if(idx >= 0) G.heroes.splice(idx,1);
          layoutHeroes();
          for(let k=0;k<8;k++){
            const a = rnd(0,6.28);
            G.parts.push({x:front.x,y:front.y,vx:Math.cos(a)*rnd(30,90),vy:Math.sin(a)*rnd(30,90)-20,life:.6,max:.6,col:ELEM[front.elem].ring,r:2,g:120});
          }
          G.texts.push({x:front.x, y:front.y-20, txt:'영웅 전사…', col:'#c7b6f0', life:1, max:1, size:9.5, vy:-20});
        }
        SFX.hit();
      }
    } else if(!front){
      // 벽으로
      if(e.x > 38){
        e.x -= spd*dt;
      } else {
        if(e.cdT <= 0){
          e.cdT = 1.4;
          G.wall -= e.wallDmg * (e.boss?1.4:1);
          G.wallFlash = 1; G.shake = 6;
          G.texts.push({x:44, y:e.y-22, txt:'-'+Math.round(e.wallDmg*(e.boss?1.4:1)), col:'#ff7b7b', life:.7, max:.7, size:11, vy:-24});
          SFX.wallHit();
          syncHUD();
          if(G.wall <= 0){ G.wall = 0; gameOver(); return; }
        }
      }
    } else {
      e.x -= spd*dt;
    }
  }

  updateFX(dt);

  // 웨이브 종료
  if(G.phase === 'play' && G.waveOn && G.queue.length === 0 && G.enemies.length === 0){
    if(G.waveClearT < 0) G.waveClearT = 0.7;
    else {
      G.waveClearT -= dt;
      if(G.waveClearT <= 0){ G.waveOn = false; openUpgrade(); }
    }
  }
  syncHUD();
}
function updateFX(dt){
  for(let i=G.parts.length-1;i>=0;i--){
    const p = G.parts[i];
    p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += (p.g||0)*dt; p.vx *= .98;
    if(p.life <= 0) G.parts.splice(i,1);
  }
  for(let i=G.texts.length-1;i>=0;i--){
    const t = G.texts[i];
    t.life -= dt; t.y += (t.vy||-20)*dt;
    if(t.life <= 0) G.texts.splice(i,1);
  }
  for(let i=G.rings.length-1;i>=0;i--){
    const r = G.rings[i];
    r.life -= dt;
    if(r.life <= 0) G.rings.splice(i,1);
  }
}

/* ═══════════ HUD ═══════════ */
function syncHUD(){
  waveTag.textContent = '웨이브 ' + G.wave + (G.phase==='over'||G.win ? '' : ' / ' + WAVES_TOTAL);
  const p = clamp(G.wall/G.wallMax, 0, 1);
  wallFill.style.width = (p*100) + '%';
  wallNum.textContent = Math.max(0, Math.round(G.wall));
  wallBox.classList.toggle('low', p < .4);
  killTag.textContent = '처치 ' + G.kills;
}
function syncAll(){ syncHUD(); syncButtons(); syncLock(); }

/* ═══════════ 입력 ═══════════ */
reelEls.forEach((el)=>{
  el.addEventListener('click', ()=>{
    if(G.phase !== 'play' || G.spinning > 0) return;
    const col = +el.dataset.col;
    G.locked = (G.locked === col) ? -1 : col;
    syncLock();
    SFX.tick();
  });
});
rerollBtn.addEventListener('click', ()=>{
  if(G.phase !== 'play' || G.rerolls <= 0 || G.spinning > 0) return;
  G.rerolls--;
  syncButtons();
  const cols = G.locked >= 0 ? [0,1,2].filter(c=>c !== G.locked) : [0,1,2];
  spinCols(cols);
});
combineBtn.addEventListener('click', combine);
$('#retryBtn').addEventListener('click', restart);
soundBtn.addEventListener('click', ()=>{
  AU.muted = !AU.muted;
  soundBtn.textContent = AU.muted ? '🔇' : '🔊';
  soundBtn.classList.toggle('off', AU.muted);
  if(!AU.muted) SFX.pick();
});
document.addEventListener('pointerdown', ()=>{ actx(); }, {once:false, passive:true});
window.addEventListener('keydown', (e)=>{
  if(e.code === 'Space'){ e.preventDefault(); combine(); }
  if(e.code === 'KeyR'){ rerollBtn.click(); }
  if(e.code === 'Digit1'){ reelEls[0].click(); }
  if(e.code === 'Digit2'){ reelEls[1].click(); }
  if(e.code === 'Digit3'){ reelEls[2].click(); }
});

/* ═══════════ 시작 ═══════════ */
function boot(){
  resize();
  $('#labFlask').innerHTML = ICON.flask;
  $('#rerollIco').innerHTML = ICON.dice;
  $('#combineIco').innerHTML = ICON.flask;
  G.reels = [rndi(3), rndi(3), rndi(3)];
  renderReels(); syncAll();
  startWave();
  setTimeout(()=>hintEl.classList.add('gone'), 14000);
  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000) || 0;
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

/* ═══════════ 테스트 훅 ═══════════ */
window.__GAME = {
  G,
  state(){
    return {
      phase: G.phase, wave: G.wave, wall: G.wall, wallMax: G.wallMax, kills: G.kills,
      heroes: G.heroes.map(h=>({elem:h.elem, weap:h.weap, trait:h.trait, star:h.star, x:Math.round(h.x), hp:Math.round(h.hp), hpMax:Math.round(h.hpMax)})),
      enemies: G.enemies.length, queue: G.queue.length,
      reels: [COLS[0][G.reels[0]], COLS[1][G.reels[1]], COLS[2][G.reels[2]]],
      reelNames: reelEls.map(el=>el.querySelector('.nm').textContent),
      locked: G.locked, rerolls: G.rerolls, rerollMax: G.rerollMax,
      cool: +G.cool.toFixed(2), spinning: G.spinning, mods: Object.assign({}, G.mods),
      buttons: {combine: combineBtn.disabled, reroll: rerollBtn.disabled},
      upgradeOpen: !upLayer.classList.contains('hidden'),
      overOpen: !overLayer.classList.contains('hidden'),
      layout: {
        sw: document.documentElement.scrollWidth, sh: document.documentElement.scrollHeight,
        iw: window.innerWidth, ih: window.innerHeight,
        stage: Math.round(stage.getBoundingClientRect().height),
        lab: Math.round(document.getElementById('lab').getBoundingClientRect().height)
      }
    };
  },
  spawnHero, combine, checkMerge,
  /* ── 개발/밸런스 검증용 ── */
  tick(dt){ update(dt); draw(); },
  tune(o){ Object.assign(TUNE, o); },
  tuneVal(){ return Object.assign({}, TUNE); },
  combineNow(){
    if(G.phase !== 'play' || G.cool > 0 || G.spinning > 0) return false;
    const elem = COLS[0][G.reels[0]], weap = COLS[1][G.reels[1]], trait = COLS[2][G.reels[2]];
    G.cool = G.coolMax * G.mods.cool;
    G.firstCombine = true;
    spawnHero(elem, weap, trait, 1);
    G.reels = [rollIndex(0), rollIndex(1), rollIndex(2)];
    renderReels(); G.locked = -1; G.rerolls = G.rerollMax;
    syncAll();
    return true;
  },
  sim(seconds, interval){
    const dt = 1/60;
    const gap = interval || 0;
    let wait = 0;
    for(let i=0;i<seconds*60;i++){
      if(G.phase === 'upgrade'){
        const op = G.offer && G.offer[0];
        if(op){ op.apply(); G.phase='play'; upLayer.classList.add('hidden'); G.wave++; startWave(); }
      } else if(G.phase === 'play' && G.cool <= 0){
        wait -= dt;
        if(wait <= 0){ this.combineNow(); wait = gap; }
      }
      update(dt);
      if(G.phase === 'over' || G.phase === 'win') break;
    }
    return this.state();
  },
  addHero(elem,weap,trait,star){ return spawnHero(elem,weap,trait,star||1); },
  setReels(a,b,c){ G.reels=[a,b,c]; renderReels(); },
  clearEnemies(){ G.enemies.length = 0; G.queue.length = 0; },
  spawn(spec){ return addEnemy(spec || enemySpec(G.wave,false)); },
  setWall(v){ G.wall = v; syncHUD(); },
  forceUpgrade(){ openUpgrade(); },
  heroStats
};

window.addEventListener('load', ()=>{ resize(); setTimeout(resize, 60); });
boot();
})();
</script>
